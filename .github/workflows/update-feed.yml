name: Validate and publish PennyHunter feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
  push:
    branches: [main]
    paths:
      - 'incoming/**'
      - 'approved/**'
      - 'scripts/build_feed.py'
      - '.github/workflows/update-feed.yml'

permissions:
  contents: write

concurrency:
  group: pennyhunter-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate approved reports and build feed
        run: python scripts/build_feed.py

      - name: Publish only if feed changed
        run: |
          if git diff --quiet -- penny-reports.csv; then
            echo 'No changes to publish'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add penny-reports.csv
          git commit -m 'Update validated PennyHunter feed'
          git push
